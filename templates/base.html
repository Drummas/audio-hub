<!doctype html>
<html>
  <head>
    <title>{{ title or "Local Audio Hub" }}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="/static/js/theme.js" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body>

	  {% include "nav.html" %}

	  <div class="layout">
		<aside class="sidebar">
			<h2>Audio Hub</h2>
		</aside>
		<main class="main">
			{% block body %}{% endblock %}
		</main>
	  </div>
	  <script>
		// ------------------------------
		// Active Jobs Badge
		// ------------------------------
		const badge = document.getElementById("job-badge");

		function updateBadge(data) {
		  const single = data.single || [];
		  const batch = data.batch || [];
		  const total = single.length + batch.length;

		  badge.textContent = `Jobs: ${total}`;
		  badge.style.color = total > 0 ? "#0f0" : "#888";
		  badge.style.borderColor = total > 0 ? "#0f0" : "#444";
		}

		function connectWS() {
		  const wsUrl = `ws://${window.location.host}/ws/jobcount`;
		  const ws = new WebSocket(wsUrl);

		  ws.onmessage = (ev) => updateBadge(JSON.parse(ev.data));
		  ws.onerror = () => ws.close();
		  ws.onclose = () => connectSSE();
		}

		function connectSSE() {
		  const evt = new EventSource("/v1/jobcount");

		  evt.onmessage = (ev) => {
			updateBadge(JSON.parse(ev.data));
		  };

		  evt.onerror = () => evt.close();
		}

		// Start WebSocket → fallback to SSE
		connectWS();  
	  </script>   
	</body>
	<svg style="display:none;">
	  <symbol id="icon-home" viewBox="0 0 24 24">
		<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/>

      <symbol id="icon-performance" viewBox="0 0 24 24">

	</svg>
	<script>
		const hamburger = document.getElementById("hamburger");
		const mobileMenu = document.getElementById("mobile-menu");

		hamburger.addEventListener("click", () => {
		  mobileMenu.classList.toggle("open");
		});

		document.getElementById("theme-toggle").addEventListener("click", () => {
		  document.body.classList.toggle("light-theme");
		});
	</script>
</html>
