{% extends "base.html" %}

{% block body %}
<h1>Job Monitor</h1>

<h2>Single‑File Jobs</h2>
<div id="single-jobs"></div>

<h2>Batch Jobs</h2>
<div id="batch-jobs"></div>

<script>
function renderJob(container, id, data) {
  const pct = data.total ? Math.floor((data.completed / data.total) * 100) : 0;

  container.innerHTML = `
    <div style="border:1px solid #444; padding:10px; margin-bottom:10px;">
      <strong>ID:</strong> ${id}<br>
      <strong>Status:</strong> ${data.status}<br>
      <strong>Progress:</strong> ${pct}%<br>
      <progress value="${pct}" max="100" style="width:100%; height:20px;"></progress>
      <pre>${JSON.stringify(data, null, 2)}</pre>
    </div>
  `;
}

function connectWS(type, id) {
  const wsUrl = `ws://${window.location.host}/ws/${type}/${id}`;
  const ws = new WebSocket(wsUrl);

  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    const container = document.getElementById(`${type}-jobs`);
    renderJob(container, id, data);
  };

  ws.onerror = () => ws.close();
  ws.onclose = () => connectSSE(type, id);
}

function connectSSE(type, id) {
  const evt = new EventSource(`/v1/${type}-progress/${id}`);

  evt.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    const container = document.getElementById(`${type}-jobs`);
    renderJob(container, id, data);
    if (data.status === "completed") evt.close();
  };

  evt.onerror = () => evt.close();
}

// Fetch active jobs
fetch("/ui/monitor_data")
  .then(r => r.json())
  .then(data => {
    for (const id of data.single) connectWS("single", id);
    for (const id of data.batch) connectWS("progress", id);
  });
</script>

{% endblock %}
