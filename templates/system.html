{% extends "base.html" %}

{% block body %}
<h1>System & Performance</h1>

<style>
.sys-card {
  background:#111;
  border:1px solid #333;
  padding:15px;
  border-radius:8px;
  margin-bottom:20px;
}
.bar {
  width:100%;
  height:18px;
  background:#222;
  border-radius:4px;
  overflow:hidden;
  margin-top:6px;
}
.bar-fill {
  height:100%;
  background:#0f0;
  width:0%;
  transition:width 0.3s ease;
}
.label {
  font-size:14px;
  margin-top:6px;
}
.sparkline {
  height:40px;
  width:100%;
  background:#222;
  border-radius:4px;
  margin-top:10px;
}
.sparkline canvas {
  width:100%;
  height:40px;
}
.io-box, .net-box, .temp-box {
  margin-top:10px;
  padding:10px;
  background:#111;
  border:1px solid #333;
  border-radius:6px;
}
.health {
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}
.health.ok { color:#0f0; }
.health.warn { color:#ff0; }
.health.crit { color:#f33; }
.advanced-toggle {
  cursor:pointer;
  color:#0af;
  margin-top:20px;
}
.advanced-panel {
  display:none;
  margin-top:10px;
}
.config-row {
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:10px;
  flex-wrap:wrap;
}
</style>

<div class="sys-card">
  <h2>CPU Usage</h2>
  <div class="label" id="cpu-label">0%</div>
  <div class="bar"><div class="bar-fill" id="cpu-bar"></div></div>
  <div class="sparkline"><canvas id="cpu-spark"></canvas></div>
</div>

<div class="sys-card">
  <h2>Memory Usage</h2>
  <div class="label" id="ram-label">0%</div>
  <div class="bar"><div class="bar-fill" id="ram-bar"></div></div>
  <div class="sparkline"><canvas id="ram-spark"></canvas></div>
</div>

<div class="sys-card">
  <h2>Disk Usage</h2>
  <div id="disk-container"></div>
</div>

<div class="sys-card">
  <h2>Disk I/O</h2>
  <div class="io-box">
    Read: <span id="disk-read">0</span> B/s<br>
    Write: <span id="disk-write">0</span> B/s
  </div>
</div>

<div class="sys-card">
  <h2>Network Throughput</h2>
  <div class="net-box">
    Download: <span id="net-recv">0</span> B/s<br>
    Upload: <span id="net-sent">0</span> B/s
  </div>
</div>

<div class="sys-card">
  <h2>Temperatures</h2>
  <div class="temp-box" id="temp-box">No sensors detected</div>
</div>

<div class="sys-card">
  <h2>System Health</h2>
  <div id="health-indicator" class="health ok">OK</div>
</div>

<div class="sys-card">
  <div class="advanced-toggle" id="adv-toggle">Show advanced metrics ▼</div>
  <div class="advanced-panel" id="adv-panel">
    <pre id="raw-json"></pre>
  </div>
</div>

<script>
function drawSparkline(canvas, data) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = canvas.offsetHeight;

  ctx.clearRect(0, 0, w, h);
  if (!data || data.length === 0) return;

  ctx.strokeStyle = "#0f0";
  ctx.lineWidth = 2;
  ctx.beginPath();

  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - (v / 100) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });

  ctx.stroke();
}

function updateHealth(cpu, ram, disk) {
  const el = document.getElementById("health-indicator");
  if (cpu < 70 && ram < 70 && disk < 80) {
    el.textContent = "OK";
    el.className = "health ok";
  } else if (cpu < 90 && ram < 90 && disk < 90) {
    el.textContent = "Warning";
    el.className = "health warn";
  } else {
    el.textContent = "Critical";
    el.className = "health crit";
  }
}

async function refreshStats() {
  const resp = await fetch("/api/system_stats");
  const data = await resp.json();

  // CPU
  const cpu = data.system.cpu_percent;
  document.getElementById("cpu-label").textContent = cpu + "%";
  document.getElementById("cpu-bar").style.width = cpu + "%";
  drawSparkline(document.getElementById("cpu-spark"), data.cpu_history);

  // RAM
  const ram = data.system.memory_percent;
  document.getElementById("ram-label").textContent = ram + "%";
  document.getElementById("ram-bar").style.width = ram + "%";
  drawSparkline(document.getElementById("ram-spark"), data.ram_history);

  // Disk usage
  const diskDiv = document.getElementById("disk-container");
  diskDiv.innerHTML = "";
  if (data.disk) {
    data.disk.forEach(d => {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "12px";
      wrap.innerHTML = `
        <div class="label">${d.path}: ${d.percent}%</div>
        <div class="bar"><div class="bar-fill" style="width:${d.percent}%;"></div></div>
      `;
      diskDiv.appendChild(wrap);
    });
  }

  // Disk I/O
  document.getElementById("disk-read").textContent = data.disk_io.read;
  document.getElementById("disk-write").textContent = data.disk_io.write;

  // Network
  document.getElementById("net-recv").textContent = data.network.recv;
  document.getElementById("net-sent").textContent = data.network.sent;

  // Temps
  const tempBox = document.getElementById("temp-box");
  tempBox.innerHTML = "";
  if (!data.temps || Object.keys(data.temps).length === 0) {
    tempBox.textContent = "No sensors detected";
  } else {
    for (const chip in data.temps) {
      data.temps[chip].forEach(t => {
        tempBox.innerHTML += `${chip}: ${t.current}°C<br>`;
      });
    }
  }

  // Health
  const diskPercent = data.disk && data.disk.length ? data.disk[0].percent : 0;
  updateHealth(cpu, ram, diskPercent);

  // Config
  document.getElementById("timeout-input").value = data.config.whisper_timeout;
  document.getElementById("auto-model").checked = data.config.auto_model_enabled;
  document.getElementById("override-model").value = data.config.whisper_model_override || "";

  // Advanced
  document.getElementById("raw-json").textContent = JSON.stringify(data, null, 2);
}

// Advanced toggle
document.getElementById("adv-toggle").onclick = () => {
  const panel = document.getElementById("adv-panel");
  const open = panel.style.display === "block";
  panel.style.display = open ? "none" : "block";
  document.getElementById("adv-toggle").textContent = open ? "Show advanced metrics ▼" : "Hide advanced metrics ▲";
};

setInterval(refreshStats, 2000);
refreshStats();
</script>

{% endblock %}
