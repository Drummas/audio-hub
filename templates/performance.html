{% extends "base.html" %}

{% block body %}
<h1>Model Performance</h1>

<style>
	.sys-card {
	  background:#111;
	  border:1px solid #333;
	  padding:15px;
	  border-radius:8px;
	  margin-bottom:20px;
	}
	.bar {
	  width:100%;
	  height:18px;
	  background:#222;
	  border-radius:4px;
	  overflow:hidden;
	  margin-top:6px;
	}
	.bar-fill {
	  height:100%;
	  background:#0f0;
	  width:0%;
	  transition:width 0.3s ease;
	}
	.label {
	  font-size:14px;
	  margin-top:6px;
	}
	.sparkline {
	  height:40px;
	  width:100%;
	  background:#222;
	  border-radius:4px;
	  margin-top:10px;
	}
	.sparkline canvas {
	  width:100%;
	  height:40px;
	}
	.io-box, .net-box, .temp-box {
	  margin-top:10px;
	  padding:10px;
	  background:#111;
	  border:1px solid #333;
	  border-radius:6px;
	}
	.health {
	  font-size:20px;
	  font-weight:bold;
	  margin-bottom:10px;
	}
	.health.ok { color:#0f0; }
	.health.warn { color:#ff0; }
	.health.crit { color:#f33; }
	.advanced-toggle {
	  cursor:pointer;
	  color:#0af;
	  margin-top:20px;
	}
	.advanced-panel {
	  display:none;
	  margin-top:10px;
	}
	.config-row {
	  display:flex;
	  gap:10px;
	  align-items:center;
	  margin-top:10px;
	  flex-wrap:wrap;
	}
</style>

<div class="sys-card">
  <h2>Whisper Performance & Config</h2>

  <div class="config-row">
    <button id="speedtest-btn">Run Model Speed Test</button>
    <span id="speedtest-result"></span>
  </div>

  <div class="config-row">
    <label>Recommended Model:</label>
    <span id="recommended-model">Run speed test to calculate</span>
  </div>

  <div class="config-row">
    <label>Timeout (seconds):</label>
    <input type="number" id="timeout-input" min="60" max="7200" step="30">
    <button id="timeout-save">Save</button>
    <span id="timeout-status"></span>
  </div>

  <div class="config-row">
    <label><input type="checkbox" id="auto-model"> Enable Auto Model Selection</label>
    <label>Override Model:</label>
    <select id="override-model">
      <option value="">None</option>
      <option value="tiny">tiny</option>
      <option value="base">base</option>
      <option value="small">small</option>
      <option value="medium">medium</option>
      <option value="large-v3">large-v3</option>
    </select>
    <button id="model-save">Save Model Config</button>
    <span id="model-status"></span>
  </div>
</div>

<script>
	// -----------------------------
	// Button handlers (run once)
	// -----------------------------
	document.getElementById("speedtest-btn").onclick = async () => {
	  const el = document.getElementById("speedtest-result");
	  el.textContent = "Running speed test…";
	  const resp = await fetch("/api/model_speedtest", { method: "POST" });
	  const data = await resp.json();
	  el.textContent = `Model: ${data.model}, ${data.processing_seconds.toFixed(2)}s for 5s audio, ~${data.estimated_minutes_per_minute.toFixed(2)}x realtime`;
	  document.getElementById("recommended-model").textContent = data.recommended_model;
	};

	document.getElementById("timeout-save").onclick = async () => {
	  const val = parseInt(document.getElementById("timeout-input").value, 10);
	  const resp = await fetch("/api/set_timeout", {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify({ timeout: val })
	  });
	  const data = await resp.json();
	  document.getElementById("timeout-status").textContent = `Saved: ${data.timeout}s`;
	};

	document.getElementById("model-save").onclick = async () => {
	  const autoEnabled = document.getElementById("auto-model").checked;
	  const override = document.getElementById("override-model").value || null;
	  const resp = await fetch("/api/set_model_config", {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify({ auto_enabled: autoEnabled, override_model: override })
	  });
	  document.getElementById("model-status").textContent = "Saved";
	};

	// -----------------------------
	// Refresh config every 2 seconds
	// -----------------------------
	async function refreshStats() {
	  const resp = await fetch("/api/system_stats");
	  const data = await resp.json();

	  document.getElementById("timeout-input").value = data.config.whisper_timeout;
	  document.getElementById("auto-model").checked = data.config.auto_model_enabled;
	  document.getElementById("override-model").value = data.config.whisper_model_override || "";
	}

	setInterval(refreshStats, 2000);
	refreshStats();
</script>

{% endblock %}
