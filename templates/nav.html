<!-- templates/nav.html -->

<style>
/* ============================
   BULLETPROOF TOP NAV
   ============================ */

.ah-nav {
  width: 100%;
  background: #111;
  border-bottom: 1px solid #333;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-sizing: border-box;
}

.ah-nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  box-sizing: border-box;
}

/* LEFT SIDE */
.ah-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

/* DESKTOP LINKS */
.ah-links {
  display: flex;
  gap: 20px;
  align-items: center;
  white-space: nowrap;
}

.ah-links a {
  color: #ccc;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ah-links a:hover {
  color: #fff;
}

/* RIGHT SIDE */
.ah-right {
  display: flex;
  align-items: center;
  gap: 15px;
  white-space: nowrap;
}

/* ICONS */
.ah-icon {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

/* HAMBURGER */
.ah-hamburger {
  display: none;
  cursor: pointer;
  flex-direction: column;
  gap: 4px;
}

.ah-hamburger div {
  width: 22px;
  height: 2px;
  background: #ccc;
}

/* MOBILE MENU */
#ah-mobile-menu {
  display: none;
  flex-direction: column;
  gap: 15px;
  padding: 12px 20px;
  background: #111;
  border-bottom: 1px solid #333;
}

#ah-mobile-menu a {
  color: #ccc;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* RESPONSIVE RULES */
@media (max-width: 750px) {
  .ah-links {
    display: none;
  }
  .ah-hamburger {
    display: flex;
  }
  #ah-mobile-menu.ah-open {
    display: flex;
  }
}
</style>

<header class="ah-nav">
  <div class="ah-nav-inner">

    <div class="ah-left">
      <!-- Hamburger -->
      <div class="ah-hamburger" id="ah-hamburger">
        <div></div><div></div><div></div>
      </div>

      <!-- Desktop menu -->
      <div class="ah-links">
        <a href="/"><svg class="ah-icon"><use href="#icon-home"/></svg>Home</a>
        <a href="/ui/settings"><svg class="ah-icon"><use href="#icon-settings"/></svg>Settings</a>
        <a href="/ui/files"><svg class="ah-icon"><use href="#icon-folder"/></svg>Files</a>
        <a href="/ui/dashboard"><svg class="ah-icon"><use href="#icon-dashboard"/></svg>Dashboard</a>
        <a href="/ui/system"><svg class="ah-icon"><use href="#icon-system"/></svg>System</a>
        <a href="/ui/logs"><svg class="ah-icon"><use href="#icon-logs"/></svg>Logs</a>
      </div>
    </div> <!-- ✅ THIS WAS MISSING -->

    <div class="ah-right">
      <button id="theme-toggle" style="
        background:#111;
        color:#ccc;
        border:1px solid #444;
        padding:4px 8px;
        border-radius:6px;
        cursor:pointer;"
        onclick="toggleTheme()"
      >Toggle Theme</button>

      <span id="job-badge" style="
        background:#111;
        color:#0f0;
        padding:4px 10px;
        border-radius:12px;
        font-size:12px;
        border:1px solid #0f0;
      ">Jobs: 0</span>
    </div>

  </div>
</header>

<!-- Mobile dropdown -->
<div id="ah-mobile-menu">
  <a href="/"><svg class="ah-icon"><use href="#icon-home"/></svg>Home</a>
  <a href="/ui/settings"><svg class="ah-icon"><use href="#icon-settings"/></svg>Settings</a>
  <a href="/ui/files"><svg class="ah-icon"><use href="#icon-folder"/></svg>Files</a>
  <a href="/ui/dashboard"><svg class="ah-icon"><use href="#icon-dashboard"/></svg>Dashboard</a>
  <a href="/ui/logs"><svg class="ah-icon"><use href="#icon-logs"/></svg>Logs</a>
</div>

<script>
const ahHamburger = document.getElementById("ah-hamburger");
const ahMobileMenu = document.getElementById("ah-mobile-menu");

ahHamburger.addEventListener("click", () => {
  ahMobileMenu.classList.toggle("ah-open");
});

document.getElementById("theme-toggle").addEventListener("click", () => {
  document.body.classList.toggle("light-theme");
});
</script>
