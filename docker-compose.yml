version: "3.9"

services:
  faster-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: faster-whisper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - WHISPER_BEAM=1
      - WHISPER_LANG=auto
      - WHISPER_MODEL=large-v3-turbo
    volumes:
      - ./faster-whisper-data:/config
    ports:
      - "10300:10300"
    restart: unless-stopped

  audio-hub:
    image: ghcr.io/drummas/audio-hub:release
    container_name: audio-hub
    depends_on:
      - faster-whisper
    environment:
      FASTER_WHISPER_URL: "http://192.168.2.132:10300/inference"
      XTTS_LANGUAGE: "en"
      XTTS_VOICE: "default"
      WHISPER_MODEL: "large-v3"
      COQUI_TOS_AGREED: "1"
    volumes:
      - ./files:/app/files
      - ./batches:/app/batches
      - ./waveforms:/app/waveforms
      - ./speakers:/app/speakers
      - ./config:/app/config
      - ./tts-cache:/root/.local/share/tts
    ports:
      - "8000:8000"
    restart: unless-stopped
